<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <style>
      .title{font:700 44px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto; fill:#e5e7eb}
      .sub{font:500 18px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto; fill:#cbd5e1}
      .chip{font:600 14px ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto; fill:#0b1220}
      .chipbg{fill:#e5e7eb; opacity:.92}
      .glow{opacity:.6}
      .grid{opacity:.12}
      .pulse { animation: p 4s ease-in-out infinite; transform-origin: 50% 50%; }
      @keyframes p { 0%,100%{opacity:.55} 50%{opacity:.9} }
    </style>
  </defs>

  <rect width="1200" height="280" fill="#0b1220"/>

  <!-- soft blobs -->
  <circle cx="250" cy="60" r="120" fill="url(#g)" filter="url(#blur)" class="glow pulse"/>
  <circle cx="980" cy="210" r="140" fill="url(#g)" filter="url(#blur)" class="glow pulse"/>

  <!-- subtle grid -->
  <g class="grid">
    <path d="M0 40H1200M0 80H1200M0 120H1200M0 160H1200M0 200H1200M0 240H1200" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M80 0V280M160 0V280M240 0V280M320 0V280M400 0V280M480 0V280M560 0V280M640 0V280M720 0V280M800 0V280M880 0V280M960 0V280M1040 0V280M1120 0V280" stroke="#e5e7eb" stroke-width="1"/>
  </g>

  <text x="70" y="120" class="title">Rahul Appasaheb Gunjal</text>
  <text x="70" y="155" class="sub">Full Stack Developer • Backend • DevOps • Cybersecurity</text>

  <!-- chips -->
  <g>
    <rect x="70" y="185" rx="16" ry="16" width="110" height="32" class="chipbg"/>
    <text x="92" y="207" class="chip">Java</text>

    <rect x="190" y="185" rx="16" ry="16" width="140" height="32" class="chipbg"/>
    <text x="214" y="207" class="chip">Spring Boot</text>

    <rect x="340" y="185" rx="16" ry="16" width="95" height="32" class="chipbg"/>
    <text x="365" y="207" class="chip">React</text>

    <rect x="445" y="185" rx="16" ry="16" width="110" height="32" class="chipbg"/>
    <text x="468" y="207" class="chip">Angular</text>

    <rect x="565" y="185" rx="16" ry="16" width="105" height="32" class="chipbg"/>
    <text x="590" y="207" class="chip">Docker</text>

    <rect x="680" y="185" rx="16" ry="16" width="105" height="32" class="chipbg"/>
    <text x="704" y="207" class="chip">Jenkins</text>

    <rect x="795" y="185" rx="16" ry="16" width="110" height="32" class="chipbg"/>
    <text x="818" y="207" class="chip">Ansible</text>
  </g>
</svg>
